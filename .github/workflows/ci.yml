name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build client and verify committed artifact
        run: |
          npm run build
          git diff --exit-code -- client.js
      - name: Run standalone tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check core.js
          node --check client-core.js
          node --check client.js
